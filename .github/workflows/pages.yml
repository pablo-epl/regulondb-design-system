name: Deploy spec to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'lib/showcase.html'
      - 'dist/RegulonDB-MG-prototype.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R spec/. _site/

          if [ -f lib/showcase.html ]; then
            mkdir -p _site/showcase
            sed 's|\.\./spec/index\.html|../index.html|g' lib/showcase.html > _site/showcase/index.html
          fi

          if [ -f dist/RegulonDB-MG-prototype.pdf ]; then
            cp dist/RegulonDB-MG-prototype.pdf _site/prototype.pdf
          fi

          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
