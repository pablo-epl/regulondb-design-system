.primary-nav a[aria-current="page"] { color: var(--blue-2); border-bottom-color: var(--blue-2); font-weight: 700; }

.active-org-card .stat .lbl { color: var(--blue-4); font-size: var(--fs-mono-sm); }

import React, { useState, useMemo, useEffect } from "react";

/* =========================================================================
   COMPONENTS — duplicated here from the canonical lib/src/components/*.
   The classNames are byte-identical to the spec's components.css; props are
   byte-identical to the React TS sources. Treat this as a read-only mirror.
   ========================================================================= */

// Atoms ----------------------------------------------------------------------
const Button = ({ variant = "primary", size, loading, children, ...rest }) => (
  <button
    className={`btn btn--${variant}${size ? " btn--" + size : ""}${loading ? " btn--loading" : ""}`}
    {...rest}>{children}</button>
);
const Input    = (p) => <input className="input" {...p} />;
const Textarea = (p) => <textarea className="textarea" {...p} />;
const Checkbox = (p) => <input type="checkbox" className="checkbox" {...p} />;
const Radio    = (p) => <input type="radio" className="radio" {...p} />;
const Switch   = (p) => <input type="checkbox" className="switch" {...p} />;
const Tag      = ({ variant, children }) => <span className={`tag${variant ? " tag--" + variant : ""}`}>{children}</span>;
const Kbd      = ({ children }) => <span className="kbd">{children}</span>;
const Spinner  = () => <span className="spinner" aria-label="Loading" />;
const Skeleton = ({ width = "100%", height = 12 }) => <span className="skeleton" style={{ width, height }} />;
const Divider  = () => <hr className="divider" />;
const Link     = ({ href = "#", children }) => <a className="link" href={href}>{children}</a>;
const Label    = ({ children, ...rest }) => <label className="label" {...rest}>{children}</label>;
const HelperText = ({ error, children }) => <div className={`helper-text${error ? " helper-text--error" : ""}`}>{children}</div>;

// Scientific atoms -----------------------------------------------------------
const Gene           = ({ children }) => <em className="gene">{children}</em>;
const ProteinSymbol  = ({ children }) => <span className="protein">{children}</span>;
const OperonNotation = ({ children }) => <em className="operon-notation">{children}</em>;
const TaxonName      = ({ children, strain }) => (
  <em className="taxon">{children}{strain ? <> <span className="strain">{strain}</span></> : null}</em>
);
const SUP_MAP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const toSup = (n) => String(n).split("").map((d) => SUP_MAP[d] ?? d).join("");
const SigmaFactorLabel     = ({ value }) => <span className="sigma">σ{toSup(value)}</span>;
const PromoterPositionLabel= ({ pos })   => <span className="promoter-pos">{pos < 0 ? "−" + Math.abs(pos) : "+" + pos}</span>;
const Coordinate           = ({ value }) => <span className="coordinate">{Number(value).toLocaleString("en-US")}</span>;

// Molecules ------------------------------------------------------------------
const FormField = ({ label, helper, error, children }) => (
  <div className="form-field">
    <Label>{label}</Label>
    {children}
    {helper && <HelperText error={error}>{helper}</HelperText>}
  </div>
);
const EvidenceBadge = ({ code = "IDA", category = "curated" }) => (
  <span className={`ev-badge ev-badge--${category}`}>{code}</span>
);
const ObjectTypeTag = ({ type }) => (
  <span className={`obj-tag obj-tag--${type}`}>{type[0].toUpperCase() + type.slice(1)}</span>
);
const Tooltip = ({ label, children }) => (
  <span className="tooltip">{children}<span className="tooltip-content">{label}</span></span>
);
const Toast = ({ tone = "info", title, desc, action }) => (
  <div className={`toast${tone !== "info" ? " toast--" + tone : ""}`}>
    <div className="body"><div className="title">{title}</div>{desc && <div className="desc">{desc}</div>}</div>
    {action}
  </div>
);
const Tabs = ({ items, value, onChange, segmented }) => (
  <div className={`tabs${segmented ? " tabs--segmented" : ""}`} role="tablist">
    {items.map((label) => (
      <button key={label} role="tab" aria-selected={value === label} onClick={() => onChange?.(label)}>{label}</button>
    ))}
  </div>
);
const Breadcrumb = ({ items }) => (
  <nav className="breadcrumb" aria-label="Breadcrumb">
    {items.map((it, i) => {
      const last = i === items.length - 1;
      return (
        <React.Fragment key={i}>
          {last ? <span aria-current="page">{it.label}</span>
                : <a href={it.href || "#"}>{it.label}</a>}
          {!last && <span className="sep">›</span>}
        </React.Fragment>
      );
    })}
  </nav>
);
const Card = ({ variant, children, header, footer }) => (
  <div className={`card${variant ? " card--" + variant : ""}`}>
    {header && <header style={{ marginBottom: "var(--sp-3)" }}><h4 style={{ margin: 0 }}>{header}</h4></header>}
    {children}
    {footer && <footer style={{ marginTop: "var(--sp-3)", paddingTop: "var(--sp-3)", borderTop: "1px solid var(--border-default)" }}>{footer}</footer>}
  </div>
);
const Pagination = ({ page, total }) => (
  <div className="pagination">
    <button disabled={page === 1}>← Prev</button>
    {Array.from({ length: total }, (_, i) => i + 1).map((p) => (
      <button key={p} aria-current={p === page ? "page" : undefined}>{p}</button>
    ))}
    <button>Next →</button>
  </div>
);
const Sequence = ({ blocks, highlight }) => (
  <pre className="sequence">{blocks.map((row, i) => (
    <div key={i}>
      <span className="num">{String(row.pos).padStart(7, " ")}</span>{"  "}
      {row.seq.split(" ").map((b, j) => (
        <React.Fragment key={j}>{highlight && highlight === b ? <mark>{b}</mark> : b}{j < row.seq.split(" ").length - 1 ? " " : ""}</React.Fragment>
      ))}
    </div>
  ))}</pre>
);
const ConservationBar = ({ pct, label }) => (
  <span className="cons-bar"><span className="track"><span className="fill" style={{ width: pct + "%" }} /></span>{pct}% {label && <span style={{ color: "var(--text-secondary)" }}>{label}</span>}</span>
);
const OrganismPill = ({ symbol, taxon, strain, count, color }) => (
  <span className="org-pill">
    <span className="symbol" style={color ? { background: color } : undefined}>{symbol}</span>
    <TaxonName>{taxon}</TaxonName>
    {strain && <span className="strain">{strain}</span>}
    {count != null && <span className="count">{count.toLocaleString("en-US")}</span>}
  </span>
);
const EmptyState = ({ icon = "○", title, description, action }) => (
  <div className="empty">
    <div className="icon" aria-hidden="true">{icon}</div>
    <h4>{title}</h4>{description && <p>{description}</p>}
    {action && <div style={{ marginTop: "var(--sp-4)" }}>{action}</div>}
  </div>
);

  const story = useMemo(() => stories.find(s => s.id === active) || stories[0], [active]);

          <div className="right">
            {["desktop","tablet","mobile"].map((v) => (
              <button key={v} className={`sb-toolbar-btn${viewport === v ? " on" : ""}`} onClick={() => setViewport(v)}>
                {v[0].toUpperCase() + v.slice(1)}
              </button>
            ))}
            <span style={{ width: 8 }} />
            {["auto","light","dark"].map((t) => (
              <button key={t} className={`sb-toolbar-btn${theme === t ? " on" : ""}`} onClick={() => setTheme(t)}>
                {t}
              </button>
            ))}
          </div>
        </div>

        <div className="sb-canvas">
          <div className={`viewport ${viewport}`}>
            {/* Mount the story as its own component so hooks inside `render`
                live in their own scope. Without this, switching between a
                story that uses `useState` and one that doesn't changes the
                hook count of <App> — React error #310. The `key` ensures a
                clean unmount/mount when switching stories rapidly. */}
            {React.createElement(story.render, { key: story.id })}
          </div>
        </div>

        <div className="sb-bottom">
          <div className="tabs">
            {["Props","Code (JSX)","Code (HTML)","A11y notes"].map((t) => (
              <button key={t} className={tab === t ? "on" : ""} onClick={() => setTab(t)}>{t}</button>
            ))}
            {tab.startsWith("Code") && (
              <button className="sb-toolbar-btn" style={{ marginLeft: "auto", marginTop: 6, marginRight: 12 }}
                onClick={() => copy(tab === "Code (JSX)" ? story.jsx : story.html)}>Copy</button>
            )}
          </div>
          <div className={`body ${tab === "Props" ? "props" : ""}`}>
            {tab === "Code (JSX)" && story.jsx}
            {tab === "Code (HTML)" && story.html}
            {tab === "A11y notes" && <span style={{ whiteSpace: "normal", fontFamily: "var(--font-sans)", fontSize: "var(--fs-body)" }}>{story.a11y}</span>}
            {tab === "Props" && (
              story.props && story.props.length ? (
                <table className="data">
                  <thead><tr><th>Name</th><th>Type</th><th>Default</th></tr></thead>
                  <tbody>{story.props.map((row, i) => <tr key={i}>{row.map((c, j) => <td key={j}><code>{c}</code></td>)}</tr>)}</tbody>
                </table>
              ) : <span style={{ color: "var(--text-tertiary)" }}>No props.</span>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
